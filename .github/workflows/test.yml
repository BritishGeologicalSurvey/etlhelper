name: Lint and test

# Global environment variables for all jobs
env:
  POSTGRES_DB: etlhelper
  POSTGRES_USER: etlhelper_user
  POSTGRES_PASSWORD: etlhelper_pw
  TEST_PG_PASSWORD: etlhelper_pw

on:
  push:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@a12a3943b4bdde767164f792f33f40b04645d846  # v3
      - name: Setup Python
        uses: actions/setup-python@d09bd5e6005b175076f227b13d9730d56e9dcfcb  # v4
        with:
          python-version: '3.10'
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Install dev dependencies
        run: uv pip install . --group dev
      - name: Run flake8
        run: flake8

  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Accessed directly from host at localhost, because tests are not
        # running in a container
        image: postgis/postgis:15-3.4
        ports:
          - 5432:5432
        # Copy env vars from above - substitution didn't work
        env:
          POSTGRES_DB: etlhelper
          POSTGRES_USER: etlhelper_user
          POSTGRES_PASSWORD: etlhelper_pw
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ['3.10', 3.11, 3.12, 3.13, 3.14]
    steps:
      - name: Checkout repo
        uses: actions/checkout@a12a3943b4bdde767164f792f33f40b04645d846  # v3
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@d09bd5e6005b175076f227b13d9730d56e9dcfcb  # v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Install dependencies
        run: uv pip install .[all] --group dev
      - name: Run pytest
        run: pytest -vrsx --cov=etlhelper --cov-report term test/
